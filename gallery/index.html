<!DOCTYPE html>
<html class="no-js" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Gallery | Ray &amp; Carolyn</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A storybook gallery celebrating Ray and Carolyn.">

    <link rel="icon" type="image/png" href="/images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/animate.css">
    <link rel="stylesheet" href="/css/icomoon.css">
    <link rel="stylesheet" href="/css/bootstrap.css">
    <link rel="stylesheet" href="/css/superfish.css">
    <link rel="stylesheet" href="/css/magnific-popup.css">
    <link rel="stylesheet" href="/css/style.css?v=7">
    <link rel="stylesheet" href="/css/storybook.css?v=1">

    <script src="/js/modernizr-2.6.2.min.js"></script>
</head>

<body>
    <div id="fh5co-wrapper">
        <div id="fh5co-page">
            <section class="subpage-hero gallery-hero">
                <div class="subpage-hero-overlay" aria-hidden="true"></div>
                <div class="subpage-hero-content">
                    <p class="subpage-eyebrow">JULY 17, 2027</p>
                    <h1>Our Story</h1>
                    <div class="subpage-divider" aria-hidden="true"><span></span><b>✦</b><span></span></div>
                    <p class="subpage-location">Written beneath the same stars</p>
                </div>
            </section>
            <!-- NAVIGATION -->
            <header id="fh5co-header-section" class="sticky-banner">
                <div class="container">
                    <div class="nav-header">
                        <a href="#" class="js-fh5co-nav-toggle fh5co-nav-toggle dark">
                            <i></i>
                        </a>
                        <nav id="fh5co-menu-wrap" aria-label="Main navigation">
                            <ul class="sf-menu" id="fh5co-primary-menu">
                                <li><a href="/">Home</a></li>
                                <li><a href="/bridal-party/">The Bridal Party</a></li>
                                <li><a href="/when-where/">When &amp; Where</a></li>
                                <li class="active"><a href="/gallery/">Gallery</a></li>
                                <li><a href="/registry/">Registry</a></li>
                                <li><a href="/faq/">FAQ</a></li>
                                <li><a href="/rsvp/">RSVP</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </header>


            <main id="storybook-reader">
                <section class="book-stage" aria-label="The Story of Vega and Altair">
                    <div class="book-cover" id="bookCover">
                        <img src="/storybook/front-cover.png" alt="The Story of Vega and Altair">
                        <button class="book-open" id="openBook" type="button">Open the Story <b>✦</b></button>
                    </div>
                    <div class="book-interior" id="bookInterior" hidden>
                        <div class="book-spread">
                            <article class="book-page book-page-left"><img src="/storybook/inside-left.png" alt=""></article>
                            <div class="book-gutter"></div>
                            <article class="book-page book-page-right"><img src="/storybook/inside-right.png" alt=""></article>
                        </div>
                        <div class="book-controls">
                            <button type="button" id="closeBook" class="book-nav">‹ Cover</button>
                            <span>Inside Cover</span>
                            <button type="button" class="book-nav" disabled>Next ›</button>
                        </div>
                    </div>
                </section>
            </main>
            <!-- FOOTER -->
            <footer>
                <div id="footer">
                    <div class="container">

                        <div class="row">
                            <div class="col-md-12 text-center">
                                <h2>R &amp; C</h2>
                                <p>July 17, 2027</p>
                            </div>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

        </div>
    </div>

    <script src="/js/jquery.stellar.min.js"></script>

    <script src="/js/superfish.js"></script>
    <script src="/js/jquery.magnific-popup.min.js"></script>
    <script src="/js/magnific-popup-options.js"></script>
    <script src="/js/sticky.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/storybook.js?v=1"></script>

</body>
</html>
