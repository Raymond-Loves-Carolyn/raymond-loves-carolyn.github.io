<!DOCTYPE html>
<html class="no-js" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Gallery | Ray &amp; Carolyn</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A storybook gallery celebrating Ray and Carolyn.">

    <link rel="icon" type="image/png" href="/images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/animate.css">
    <link rel="stylesheet" href="/css/icomoon.css">
    <link rel="stylesheet" href="/css/bootstrap.css">
    <link rel="stylesheet" href="/css/superfish.css">
    <link rel="stylesheet" href="/css/magnific-popup.css">
    <link rel="stylesheet" href="/css/style.css?v=7">

    <script src="/js/modernizr-2.6.2.min.js"></script>
</head>

<body>
    <div id="fh5co-wrapper">
        <div id="fh5co-page">
            <section class="subpage-hero gallery-hero">
                <div class="subpage-hero-overlay" aria-hidden="true"></div>
                <div class="subpage-hero-content">
                    <p class="subpage-eyebrow">JULY 17, 2027</p>
                    <h1>Our Story</h1>
                    <div class="subpage-divider" aria-hidden="true"><span></span><b>✦</b><span></span></div>
                    <p class="subpage-location">Written beneath the same stars</p>
                </div>
            </section>
            <!-- NAVIGATION -->
            <header id="fh5co-header-section" class="sticky-banner">
                <div class="container">
                    <div class="nav-header">
                        <a href="#" class="js-fh5co-nav-toggle fh5co-nav-toggle dark">
                            <i></i>
                        </a>
                        <nav id="fh5co-menu-wrap" aria-label="Main navigation">
                            <ul class="sf-menu" id="fh5co-primary-menu">
                                <li><a href="/">Home</a></li>
                                <li><a href="/bridal-party/">The Bridal Party</a></li>
                                <li><a href="/when-where/">When &amp; Where</a></li>
                                <li class="active"><a href="/gallery/">Gallery</a></li>
                                <li><a href="/registry/">Registry</a></li>
                                <li><a href="/faq/">FAQ</a></li>
                                <li><a href="/rsvp/">RSVP</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </header>


            <main id="storybook-reader">
                <section class="book-stage" aria-label="The Story of Vega and Altair">
                    <div class="book-cover" id="bookCover">
                        <img src="/storybook/front-cover.png" alt="The Story of Vega and Altair">
                        <button class="book-open" id="openBook" type="button">Open the Story <b>✦</b></button>
                    </div>
                    <div class="book-interior" id="bookInterior" hidden>
                        <div class="book-spread">
                            <article class="book-page book-page-left"><img src="/storybook/inside-left.png" alt=""></article>
                            <div class="book-gutter"></div>
                            <article class="book-page book-page-right"><img src="/storybook/inside-right.png" alt=""></article>
                        </div>
                        <div class="book-controls">
                            <button type="button" id="closeBook" class="book-nav">‹ Cover</button>
                            <span>Inside Cover</span>
                            <button type="button" class="book-nav" disabled>Next ›</button>
                        </div>
                    </div>
                </section>
            </main>
            <!-- FOOTER -->
            <footer>
                <div id="footer">
                    <div class="container">

                        <div class="row">
                            <div class="col-md-12 text-center">
                                <h2>R &amp; C</h2>
                                <p>July 17, 2027</p>
                            </div>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

        </div>
    </div>

<style>
#storybook-reader{padding:80px 24px 100px;background:radial-gradient(circle at 50% 18%,rgba(95,147,228,.08),transparent 34%),#071426}
.book-stage{max-width:1320px;margin:auto}.book-cover{position:relative;width:min(520px,88vw);aspect-ratio:4/5;margin:auto;box-shadow:18px 22px 45px rgba(0,0,0,.42)}
.book-cover img,.book-page img{display:block;width:100%;height:100%;object-fit:cover}.book-open{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);min-height:46px;padding:10px 20px;border:1px solid rgba(216,198,157,.7);background:rgba(7,20,38,.82);color:#f8f2e6;font:500 10px Montserrat,sans-serif;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}.book-open b{color:#d8c69d;margin-left:10px}
.book-interior{max-width:1120px;margin:auto}.book-spread{display:grid;grid-template-columns:1fr 12px 1fr;filter:drop-shadow(0 24px 35px rgba(0,0,0,.34))}.book-page{aspect-ratio:4/5;overflow:hidden;background:#eee7d7}.book-gutter{background:linear-gradient(90deg,rgba(0,0,0,.32),rgba(255,255,255,.08),rgba(0,0,0,.32))}
.book-controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;margin-top:28px;color:#d8c69d;font:italic 18px 'Cormorant Garamond',serif}.book-nav{min-height:44px;padding:8px 16px;border:1px solid rgba(194,166,121,.35);background:transparent;color:rgba(248,242,230,.82);font:500 10px Montserrat,sans-serif;letter-spacing:1.5px;text-transform:uppercase}.book-nav:first-child{justify-self:start}.book-nav:last-child{justify-self:end}.book-nav:disabled{opacity:.3}
.book-cover.is-opening{animation:coverOpen .55s ease both}@keyframes coverOpen{to{opacity:0;transform:translateX(-3%) rotateY(-12deg)}}@media(prefers-reduced-motion:reduce){.book-cover.is-opening{animation:none}}
@media(max-width:768px){#storybook-reader{padding:55px 16px 75px}.book-interior{max-width:520px}.book-spread{display:block}.book-gutter,.book-page-left{display:none}.book-controls{gap:8px}.book-controls span{font-size:15px}}
</style>
<script>
(function(){var c=document.getElementById('bookCover'),i=document.getElementById('bookInterior'),o=document.getElementById('openBook'),x=document.getElementById('closeBook');if(!c||!i)return;o.addEventListener('click',function(){c.classList.add('is-opening');setTimeout(function(){c.hidden=true;i.hidden=false;c.classList.remove('is-opening')},window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:520)});x.addEventListener('click',function(){i.hidden=true;c.hidden=false})})();
</script>
    <!-- JAVASCRIPT -->
    <script src="/js/jquery.min.js"></script>
    <script src="/js/jquery.easing.1.3.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/jquery.waypoints.min.js"></script>
    <script src="/js/jquery.stellar.min.js"></script>
    <script src="/js/hoverIntent.js"></script>
    <script src="/js/superfish.js"></script>
    <script src="/js/jquery.magnific-popup.min.js"></script>
    <script src="/js/magnific-popup-options.js"></script>
    <script src="/js/sticky.js"></script>
    <script src="/js/main.js"></script>

</body>
</html>
